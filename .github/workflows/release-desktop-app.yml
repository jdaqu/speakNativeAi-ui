name: Build and Release Desktop App

on:
  push:
    branches: [main]
  workflow_dispatch:  # Keep manual trigger as backup

concurrency:
  group: "release"
  cancel-in-progress: false  # Queue sequential runs, don't cancel

permissions:
  contents: write  # Required to create tags and releases

jobs:
  # Job 1: Auto-increment version and create tag
  version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_version_number: ${{ steps.bump.outputs.new_version_number }}
      previous_version: ${{ steps.bump.outputs.previous_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Get latest tag and bump version
        id: bump
        run: |
          # Get latest semantic version tag (e.g., v1.0.4)
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # No tags exist, start with v1.0.0
            NEW_VERSION="v1.0.0"
            PREV_VERSION="none"
          else
            # Extract version numbers
            PREV_VERSION="${LATEST_TAG}"
            VERSION_NUM="${LATEST_TAG#v}"
            MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
            MINOR=$(echo $VERSION_NUM | cut -d. -f2)
            PATCH=$(echo $VERSION_NUM | cut -d. -f3)

            # Increment patch version
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            VERSION_NUM="${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          # Extract version number without 'v' prefix
          NEW_VERSION_NUMBER="${NEW_VERSION#v}"

          echo "previous_version=${PREV_VERSION}" >> $GITHUB_OUTPUT
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "new_version_number=${NEW_VERSION_NUMBER}" >> $GITHUB_OUTPUT

          echo "Previous version: ${PREV_VERSION}"
          echo "New version: ${NEW_VERSION}"

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump.outputs.new_version }}
          git push origin ${{ steps.bump.outputs.new_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          VERSION_NUM="${{ steps.bump.outputs.new_version_number }}"
          PREV="${{ steps.bump.outputs.previous_version }}"

          # Get commit messages since last tag
          if [ "$PREV" = "none" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -10)
          else
            COMMITS=$(git log ${PREV}..HEAD --pretty=format:"- %s (%h)")
          fi

          # Create release notes
          cat > notes.md << 'EOF'
          ## Desktop App Release

          ### What's New
          EOF

          if [ -n "$COMMITS" ]; then
            echo "$COMMITS" >> notes.md
          else
            echo "- Automated release from main branch" >> notes.md
          fi

          cat >> notes.md << EOF

          ### Downloads

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS | Apple Silicon (M1/M2/M3) | [SpeakNativeAI-mac-arm64.dmg](https://github.com/jdaqu/speakNativeAi-ui/releases/download/${VERSION}/SpeakNativeAI-${VERSION_NUM}-mac-arm64.dmg) |
          | macOS | Intel | [SpeakNativeAI-mac-intel.dmg](https://github.com/jdaqu/speakNativeAi-ui/releases/download/${VERSION}/SpeakNativeAI-${VERSION_NUM}-mac-intel.dmg) |

          ### Installation
          1. Download the appropriate version for your Mac
          2. Open the .dmg file
          3. Drag SpeakNative AI to your Applications folder
          4. Launch the app and sign in with your account

          ### Features
          - Global hotkey access (Cmd+Shift+S)
          - Quick Fix, Translate & Define popup
          - System tray integration
          - Native OS integration
          - Works with authenticated API access
          EOF

          echo "Release notes generated"
          cat notes.md

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_version }}
          name: Release ${{ steps.bump.outputs.new_version }}
          body_path: notes.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Build DMGs and upload directly to release (no artifact transfer)
  build:
    needs: version
    strategy:
      matrix:
        arch: [arm64, x64]
      fail-fast: false  # Don't cancel Intel if ARM64 fails
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update package.json version
        run: |
          VERSION_NUMBER="${{ needs.version.outputs.new_version_number }}"
          echo "Updating package.json version to $VERSION_NUMBER"
          npm version $VERSION_NUMBER --no-git-tag-version

      - name: Build for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run electron:build:arm64
          else
            npm run electron:build:intel
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Rename and prepare DMG for release
        run: |
          cd dist
          VERSION="${{ needs.version.outputs.new_version_number }}"
          ARCH="${{ matrix.arch }}"

          # Map x64 to intel for filename
          if [ "$ARCH" = "x64" ]; then
            ARCH_NAME="intel"
          else
            ARCH_NAME="arm64"
          fi

          # Find the DMG file
          DMG_FILE=$(ls *.dmg | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "Error: No DMG file found"
            exit 1
          fi

          # Rename to consistent format
          FINAL_NAME="SpeakNativeAI-${VERSION}-mac-${ARCH_NAME}.dmg"
          mv "$DMG_FILE" "$FINAL_NAME"

          # Generate SHA256 checksum
          shasum -a 256 "$FINAL_NAME" > "${FINAL_NAME}.sha256"

          echo "Prepared files:"
          ls -lh "$FINAL_NAME" "${FINAL_NAME}.sha256"
          echo "Checksum:"
          cat "${FINAL_NAME}.sha256"

          # Verify DMG integrity before upload
          echo "Verifying DMG integrity..."
          hdiutil verify "$FINAL_NAME"

      - name: Upload DMG directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          files: |
            dist/*.dmg
            dist/*.sha256
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Publish the release after both builds complete
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const draftRelease = releases.find(r => r.tag_name === '${{ needs.version.outputs.new_version }}' && r.draft);

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                draft: false
              });
              console.log(`Published release ${draftRelease.tag_name}`);
            } else {
              console.log('No draft release found to publish');
            }
